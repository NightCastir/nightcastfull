<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | NightCast</title>

    <meta name="theme-color" content="#0b1020">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top right, #202b55 0%, transparent 35%),
                radial-gradient(circle at bottom left, #321d4d 0%, transparent 35%),
                #080b16;
            color: #fff;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: rgba(15, 20, 38, 0.94);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 32px 26px;
            box-shadow:
                0 25px 70px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(16px);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            background: linear-gradient(135deg, #7c5cff, #4b8cff);
            box-shadow: 0 12px 35px rgba(91, 93, 255, 0.3);
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 26px;
        }

        .subtitle {
            margin: 10px 0 28px;
            text-align: center;
            color: #aeb6ce;
            line-height: 1.8;
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #dce2f5;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #303952;
            border-radius: 12px;
            outline: none;
            padding: 0 15px;
            background: #0c1122;
            color: white;
            font-size: 15px;
            direction: ltr;
            text-align: left;
            transition: 0.2s;
        }

        input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108,99,255,0.12);
        }

        button {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c63ff, #4b8cff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.7;
        }

        .message.error {
            display: block;
            background: rgba(220, 60, 80, 0.12);
            border: 1px solid rgba(220, 60, 80, 0.3);
            color: #ff9da9;
        }

        .message.success {
            display: block;
            background: rgba(60, 200, 130, 0.12);
            border: 1px solid rgba(60, 200, 130, 0.3);
            color: #8ef0bd;
        }

        .status {
            margin-top: 18px;
            text-align: center;
            color: #7f89a6;
            font-size: 11px;
            direction: ltr;
            word-break: break-all;
        }

        .secure {
            margin-top: 22px;
            text-align: center;
            color: #69738e;
            font-size: 11px;
        }

        .loading {
            display: none;
            text-align: center;
            color: #aeb6ce;
            margin-bottom: 15px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">✦</div>

        <h1>خوش آمدید</h1>

        <div class="subtitle">
            به حساب کاربری خود وارد شوید<br>
            تجربه‌ای ساده، سریع و امن در انتظار شماست ✨
        </div>

        <div id="message" class="message"></div>

        <div id="loading" class="loading">
            در حال برقراری ارتباط با سرویس احراز هویت...
        </div>

        <form id="loginForm">

            <div class="field">
                <label for="identifier">
                    ایمیل یا نام کاربری
                </label>

                <input
                    id="identifier"
                    name="identifier"
                    type="text"
                    autocomplete="username"
                    placeholder="نام کاربری یا ایمیل"
                    required
                >
            </div>

            <div class="field">
                <label for="password">
                    رمز عبور
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="رمز عبور"
                    required
                >
            </div>

            <button id="loginButton" type="submit">
                ورود به حساب کاربری
            </button>

        </form>

        <div class="secure">
            Secure Authentication Core
        </div>

        <div class="status">
            Worker: nightcastworks.tomasgermany2580.workers.dev
        </div>

    </div>

</div>

<script>
"use strict";

/*
|--------------------------------------------------------------------------
| NightCast Authentication
|--------------------------------------------------------------------------
*/

const WORKER_URL =
    "https://nightcastworks.tomasgermany2580.workers.dev";

const API_BASE =
    WORKER_URL + "/api/auth/v1";

let csrfToken = null;


/*
|--------------------------------------------------------------------------
| DOM
|--------------------------------------------------------------------------
*/

const form = document.getElementById("loginForm");
const identifierInput = document.getElementById("identifier");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const messageBox = document.getElementById("message");
const loadingBox = document.getElementById("loading");


/*
|--------------------------------------------------------------------------
| UI
|--------------------------------------------------------------------------
*/

function showMessage(message, type = "error") {

    messageBox.textContent = message;

    messageBox.className =
        "message " + type;
}


function clearMessage() {

    messageBox.textContent = "";

    messageBox.className =
        "message";
}


function setLoading(state) {

    loginButton.disabled = state;

    loadingBox.style.display =
        state ? "block" : "none";
}


/*
|--------------------------------------------------------------------------
| API helper
|--------------------------------------------------------------------------
*/

async function apiFetch(path, options = {}) {

    const config = {

        credentials: "include",

        ...options,

        headers: {

            "Accept": "application/json",

            ...(options.body
                ? { "Content-Type": "application/json" }
                : {}),

            ...(options.headers || {})
        }
    };

    const response =
        await fetch(API_BASE + path, config);

    const text =
        await response.text();

    let data;

    try {

        data = JSON.parse(text);

    } catch (e) {

        throw new Error(
            "پاسخ Worker معتبر نیست. HTTP " +
            response.status +
            " — " +
            text.substring(0, 150)
        );
    }

    return {
        response,
        data
    };
}


/*
|--------------------------------------------------------------------------
| CSRF
|--------------------------------------------------------------------------
*/

async function getCsrfToken() {

    const result =
        await apiFetch("/csrf", {
            method: "GET"
        });

    if (!result.response.ok) {

        throw new Error(
            result.data?.error?.message ||
            "دریافت CSRF Token ناموفق بود."
        );
    }

    if (
        !result.data.success ||
        !result.data.data?.csrfToken
    ) {

        throw new Error(
            "Worker توکن CSRF ارسال نکرد."
        );
    }

    csrfToken =
        result.data.data.csrfToken;

    return csrfToken;
}


/*
|--------------------------------------------------------------------------
| Current Session
|--------------------------------------------------------------------------
*/

async function checkSession() {

    try {

        const result =
            await apiFetch("/session", {
                method: "GET"
            });

        if (
            result.data?.success &&
            result.data?.data?.authenticated
        ) {

            const redirect =
                result.data.data.expiresAt
                    ? "/dashboard.html"
                    : "/dashboard.html";

            window.location.href =
                redirect;
        }

    } catch (e) {

        console.warn(
            "Session check failed:",
            e
        );
    }
}


/*
|--------------------------------------------------------------------------
| Login
|--------------------------------------------------------------------------
*/

async function login() {

    clearMessage();

    const identifier =
        identifierInput.value.trim();

    const password =
        passwordInput.value;

    if (!identifier) {

        showMessage(
            "نام کاربری یا ایمیل را وارد کنید."
        );

        return;
    }

    if (!password) {

        showMessage(
            "رمز عبور را وارد کنید."
        );

        return;
    }

    setLoading(true);

    try {

        /*
         * همیشه قبل از POST توکن CSRF
         * را دریافت می‌کنیم.
         */

        if (!csrfToken) {

            await getCsrfToken();
        }


        const result =
            await apiFetch(
                "/login/password",
                {
                    method: "POST",

                    headers: {
                        "X-CSRF-Token":
                            csrfToken
                    },

                    body: JSON.stringify({
                        identifier,
                        password
                    })
                }
            );


        /*
         * اگر CSRF منقضی یا نامعتبر شده
         * یک بار دوباره دریافت می‌کنیم.
         */

        if (
            result.data?.error?.code ===
            "CSRF_FAILED"
        ) {

            csrfToken = null;

            await getCsrfToken();

            const retry =
                await apiFetch(
                    "/login/password",
                    {
                        method: "POST",

                        headers: {
                            "X-CSRF-Token":
                                csrfToken
                        },

                        body: JSON.stringify({
                            identifier,
                            password
                        })
                    }
                );

            if (!retry.data.success) {

                throw new Error(
                    retry.data?.error?.message ||
                    "ورود ناموفق بود."
                );
            }

            showMessage(
                "ورود موفق بود. در حال انتقال...",
                "success"
            );

            setTimeout(() => {

                window.location.href =
                    retry.data.data.redirect ||
                    "/dashboard.html";

            }, 400);

            return;
        }


        if (!result.data.success) {

            throw new Error(
                result.data?.error?.message ||
                "نام کاربری یا رمز عبور صحیح نیست."
            );
        }


        showMessage(
            "ورود موفق بود. در حال انتقال...",
            "success"
        );


        const redirect =
            result.data.data?.redirect ||
            "/dashboard.html";

        setTimeout(() => {

            window.location.href =
                redirect;

        }, 400);

    } catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "خطایی در اتصال به سرویس احراز هویت رخ داد."
        );

    } finally {

        setLoading(false);
    }
}


/*
|--------------------------------------------------------------------------
| Form
|--------------------------------------------------------------------------
*/

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        login();
    }
);


/*
|--------------------------------------------------------------------------
| Initialisation
|--------------------------------------------------------------------------
*/

(async function init() {

    try {

        /*
         * اول Session فعلی را بررسی می‌کنیم.
         */

        await checkSession();

        /*
         * سپس CSRF را آماده می‌کنیم.
         */

        await getCsrfToken();

        console.log(
            "NightCast Authentication initialized."
        );

    } catch (error) {

        console.error(
            "Authentication initialization failed:",
            error
        );

        showMessage(
            "اتصال به سرویس احراز هویت برقرار نشد. Worker و ALLOWED_ORIGINS را بررسی کنید."
        );
    }

})();
</script>

</body>
  </html>
