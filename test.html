<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NightCast Auth Debug</title><style>body{font-family:system-ui;background:#111;color:#eee;margin:0;padding:16px}.box{max-width:900px;margin:auto}.card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:14px;margin:12px 0}button{padding:10px 14px;border:0;border-radius:9px;margin:4px;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#080808;padding:12px;border-radius:10px;overflow:auto}.ok{color:#7cff9b}.bad{color:#ff7777}.row{display:flex;gap:8px;flex-wrap:wrap}input{padding:10px;border-radius:8px;border:1px solid #444;background:#111;color:#fff}</style></head><body><div class="box"><h1>NightCast Authentication Debug</h1><div class="card"><b>Worker:</b> nightcastworks.tomasgermany2580.workers.dev<br><b>Frontend:</b> nightcastir.github.io</div><div class="row"><button onclick="config()">1. Config</button><button onclick="csrf()">2. CSRF</button><button onclick="session()">3. Session</button><button onclick="login()">4. Login</button><button onclick="logout()">5. Logout</button><button onclick="logs()">6. Logs</button><button onclick="clearLogs()">پاک کردن لاگ</button></div><div class="card"><input id="identifier" value="hamed" placeholder="username/email"><input id="password" type="password" placeholder="password"><div id="out"><pre>هنوز تستی اجرا نشده است.</pre></div></div></div><script>const W='https://nightcastworks.tomasgermany2580.workers.dev',A=W+'/api/auth/v1';let csrfToken='';async function call(path,opt={}){const t=Date.now();try{const r=await fetch(A+path,{credentials:'include',...opt,headers:{...(opt.headers||{}),...(csrfToken?{'X-CSRF-Token':csrfToken}:{})}});const tx=await r.text();let d;try{d=JSON.parse(tx)}catch{d={parseError:true,raw:tx.slice(0,3000)}};show({durationMs:Date.now()-t,httpStatus:r.status,response:d});return d}catch(e){show({networkError:e.message})}}function show(x){document.getElementById('out').innerHTML='<pre>'+esc(JSON.stringify(x,null,2))+'</pre>'}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}async function config(){return call('/config')}async function csrf(){const d=await call('/csrf');if(d?.success)csrfToken=d.data.csrfToken;return d}async function session(){return call('/session')}async function login(){if(!csrfToken){await csrf()}return call('/login/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('identifier').value,password:document.getElementById('password').value})})}async function logout(){return call('/logout',{method:'POST'})}async function logs(){return call('/debug/logs?limit=100')}async function clearLogs(){return call('/debug/clear',{method:'POST'})}config();</script></body></html>
