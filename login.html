<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NightCast | ورود</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#fff;font-family:system-ui}.card{width:min(92%,430px);background:#151b2d;padding:28px;border-radius:22px;box-shadow:0 15px 50px #0008}input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #334;background:#0c1120;color:#fff}button{cursor:pointer;background:#4c65ff;border:0;font-weight:700}.msg{margin-top:12px;padding:12px;border-radius:10px;background:#0b0f19;white-space:pre-wrap}.debug{font-size:12px;color:#aab4d6}</style></head><body><main class="card"><h1>✦ خوش آمدید</h1><p>به حساب کاربری خود وارد شوید</p><input id="id" placeholder="ایمیل یا نام کاربری" autocomplete="username"><input id="pw" type="password" placeholder="رمز عبور" autocomplete="current-password"><button id="go">ورود به حساب کاربری</button><div id="msg" class="msg">در حال اتصال امن...</div><div id="debug" class="debug"></div></main><script>const API='https://nightcastworks.tomasgermany2580.workers.dev/api/auth/v1';let csrfToken='';const $=x=>document.getElementById(x);async function req(path,opt={}){try{const r=await fetch(API+path,{credentials:'include',...opt,headers:{...(opt.headers||{}),...(csrfToken?{'X-CSRF-Token':csrfToken}:{})}});const text=await r.text();let d;try{d=JSON.parse(text)}catch{d={success:false,error:{code:'INVALID_JSON',message:text.slice(0,500)},requestId:'unknown'}};return{r,d}}catch(e){return{r:null,d:{success:false,error:{code:'NETWORK_ERROR',message:e.message},requestId:'none'}}}}async function init(){const x=await req('/csrf');if(x.d.success){csrfToken=x.d.data.csrfToken;$('msg').textContent='اتصال امن برقرار است.'}else{$('msg').textContent='اتصال امن برقرار نشد.';detail(x.d)}}function detail(d){$('debug').textContent='کد: '+(d.error?.code||'-')+'\nRequest ID: '+(d.requestId||'-')+(d.debug?'\n'+JSON.stringify(d.debug,null,2):'')}$('go').onclick=async()=>{if(!csrfToken)await init();const x=await req('/login/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('id').value,password:$('pw').value})});if(x.d.success){$('msg').textContent='ورود موفق بود؛ در حال انتقال...';location.href=x.d.data.redirect}else{$('msg').textContent=x.d.error?.message||'ورود ناموفق بود.';detail(x.d)}};init();</script></body></html>
